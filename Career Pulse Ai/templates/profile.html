<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ username }}'s Profile | CareerPulse AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card glass" style="width: 500px; text-align: center;">
            <div class="glass" style="width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; font-size: 2rem; background: var(--primary);">
                {{ username[0]|upper }}
            </div>
            <h1 style="margin-bottom: 8px;">{{ username }}</h1>
            <p style="color: var(--primary); font-weight: 600; margin-bottom: 24px;">Verified CareerPulse Professional</p>
            
            <div style="text-align: left; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; margin-bottom: 32px;">
                <h3 style="color: white; margin-bottom: 12px;">AI Skill Analysis</h3>
                <p style="color: var(--text-muted); font-size: 0.875rem; line-height: 1.6;">
                    This profile is currently being synchronized with our AI matching engine. Recruiter-specific insights will appear here once the skill verification is complete.
                </p>
            </div>

            <a href="/" class="btn btn-primary" style="width: 100%;">View Opportunities</a>
        </div>
    </div>

</body>
</html>
