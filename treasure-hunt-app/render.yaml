services:
  - type: web
    name: treasure-hunt-app
    env: node
    buildCommand: npm install && npx prisma generate && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
    startCommand: npx prisma migrate deploy && node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Provide a default admin username/password
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
      # We move the DB path to the persistent disk mount
      - key: DATABASE_URL
        value: "file:/var/data/sqlite.db"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
