<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CareerPulse AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card glass">
            <h2 style="margin-bottom: 8px; text-align: center;">Welcome Back</h2>
            <p style="color: var(--text-muted); text-align: center; margin-bottom: 32px; font-size: 0.875rem;">Enter your credentials to continue</p>
            
            {% if msg %}
            <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; border-radius: 8px; padding: 12px; color: #ef4444; font-size: 0.875rem; margin-bottom: 24px; text-align: center;">
                {{ msg }}
            </div>
            {% endif %}

            <form method="POST">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; color: var(--text-muted);">Username</label>
                    <input name="username" class="input-field" placeholder="Enter your username" required>
                </div>
                
                <div style="margin-bottom: 32px;">
                    <label style="display: block; margin-bottom: 8px; color: var(--text-muted);">Password</label>
                    <input type="password" name="password" class="input-field" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;">Login</button>
            </form>

            <p style="text-align: center; font-size: 0.875rem; color: var(--text-muted);">
                Don't have an account? <a href="/register" style="color: var(--primary); text-decoration: none;">Register</a>
            </p>
        </div>
    </div>

</body>
</html>
