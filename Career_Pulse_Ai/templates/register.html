<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a CareerPulse AI account and start matching your skills to real jobs.">
    <title>Register | CareerPulse AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card glass">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join the future of intelligent job matching</p>

            {% if msg == "success" %}
            <div class="alert alert-success">
                Account created! <a href="/login" style="color: inherit; font-weight: 700;">Login here →</a>
            </div>
            {% elif msg == "exists" %}
            <div class="alert alert-error">Username already taken — try another.</div>
            {% elif msg == "error" %}
            <div class="alert alert-error">Something went wrong. Please try again.</div>
            {% endif %}

            <form method="POST">
                <div class="auth-form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" class="input-field"
                           placeholder="Choose a username" required autocomplete="username">
                </div>

                <div class="auth-form-group" style="margin-bottom: 28px;">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" class="input-field"
                           placeholder="Create a strong password" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="/login">Login</a>
            </p>
        </div>
    </div>
</body>
</html>
