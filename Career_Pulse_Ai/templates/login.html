<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to CareerPulse AI — your personal job matching dashboard.">
    <title>Login | CareerPulse AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card glass">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Enter your credentials to access your dashboard</p>

            {% if msg %}
            <div class="alert alert-error">{{ msg }}</div>
            {% endif %}

            <form method="POST">
                <div class="auth-form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" class="input-field"
                           placeholder="Enter your username" required autocomplete="username">
                </div>

                <div class="auth-form-group" style="margin-bottom: 28px;">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" class="input-field"
                           placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="/register">Register</a>
            </p>
        </div>
    </div>
</body>
</html>
